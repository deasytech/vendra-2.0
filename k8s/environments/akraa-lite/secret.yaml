# Template — sensitive values are substituted at deploy time from GitHub Secrets
# by the deploy workflow (envsubst). Do NOT put real secrets in this file.
apiVersion: v1
kind: Secret
metadata:
  name: akraa-lite-secret
  namespace: akraa-lite
type: Opaque
stringData:
  APP_NAME: "Akraa Lite"
  APP_KEY: "${APP_KEY}"
  APP_URL: "https://lite.akraa.io"

  DB_USERNAME: "akraa_lite"
  DB_PASSWORD: "${DB_PASSWORD}"
  MYSQL_ROOT_PASSWORD: "${MYSQL_ROOT_PASSWORD}"

  REDIS_PASSWORD: ""

  TAXLY_API_KEY: "${TAXLY_API_KEY}"
  TAXLY_BASE_URL: "https://taxly.ng/api/v1"
  TAXLY_INTEGRATOR_SERVICE_ID: "${TAXLY_INTEGRATOR_SERVICE_ID}"

  FIRS_PUBLIC_KEY: "${FIRS_PUBLIC_KEY}"
  FIRS_CERTIFICATE: "${FIRS_CERTIFICATE}"

  MAIL_MAILER: "${MAIL_MAILER}"
  MAIL_HOST: "${MAIL_HOST}"
  MAIL_PORT: "${MAIL_PORT}"
  MAIL_USERNAME: "${MAIL_USERNAME}"
  MAIL_PASSWORD: "${MAIL_PASSWORD}"
  MAIL_ENCRYPTION: "${MAIL_ENCRYPTION}"
  MAIL_FROM_ADDRESS: "noreply@akraa.io"
  MAIL_FROM_NAME: "Akraa Lite"

  SESSION_SECURE_COOKIE: "true"
  SANCTUM_STATEFUL_DOMAINS: "https://lite.akraa.io"
